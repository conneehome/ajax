title: Connee Alarm
views:
  - title: Panoramica
    path: overview
    icon: mdi:shield-home
    cards:
      # Header (logo automatico light/dark)
      - type: picture
        image: https://raw.githubusercontent.com/conneehome/ajax/main/assets/connee-logo.png
        dark_mode_image: https://raw.githubusercontent.com/conneehome/ajax/main/assets/connee-logo-white.png
        tap_action:
          action: url
          url_path: https://connee.it

      # Alarm Control Panel
      - type: alarm-panel
        entity: alarm_control_panel.connee_alarm
        name: Ajax Alarm
        states:
          - arm_away
          - arm_home
          - arm_night

      # Riepilogo Sensori (contatori)
      - type: grid
        columns: 4
        square: false
        cards:
          - type: button
            entity: sensor.connee_sensori_totale
            name: TOTALE
            show_state: true
            icon: mdi:counter
          - type: button
            entity: sensor.connee_sensori_ok
            name: OK
            show_state: true
            icon: mdi:check-circle
          - type: button
            entity: sensor.connee_sensori_allarme
            name: ALLARMI
            show_state: true
            icon: mdi:alarm-light
          - type: button
            entity: sensor.connee_sensori_offline
            name: OFFLINE
            show_state: true
            icon: mdi:wifi-off

      # Sensori (aggiungili dopo averli trovati in Strumenti Sviluppatore → Stati)
      - type: entities
        title: Sensori (aggiungi i tuoi)
        show_header_toggle: false
        state_color: true
        entities:
          - type: section
            label: Istruzioni rapide
          - type: weblink
            name: Trova entità "connee"
            url: /developer-tools/state
          - type: section
            label: Incolla qui i tuoi sensori
          # Esempio (sostituisci con i tuoi entity_id reali):
          # - entity: binary_sensor.porta_principale

      - type: logbook
        title: Eventi Recenti
        entities:
          - alarm_control_panel.connee_alarm
        hours_to_show: 24

  - title: Tutte le Entità
    path: entities
    icon: mdi:format-list-bulleted
    cards:
      - type: markdown
        content: |
          In Home Assistant vai su **Impostazioni → Dispositivi e Servizi → Entità** e filtra per **"connee"**.
          
          I nomi delle entità vengono mostrati come **Ajax ...** (es. *Ajax DoorProtect*) come nell'app Ajax.

  - title: Impostazioni
    path: settings
    icon: mdi:cog
    cards:
      - type: markdown
        content: |
          ## Connee Alarm
          
          - **Alarm entity:** alarm_control_panel.connee_alarm
          - Sensori: cerca "connee" in **Strumenti Sviluppatore → Stati**
          
          **Versione:** 1.3.20
