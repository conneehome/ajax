title: Connee Alarm
views:
  - title: Sistema Allarme
    path: alarm
    icon: mdi:shield-home
    type: custom:grid-layout
    cards:
      # Header con logo Connee
      - type: markdown
        content: |
          <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 8px;">
            <img src="https://raw.githubusercontent.com/conneehome/ajax/main/logo.png" 
                 alt="Connee" 
                 style="height: 48px; filter: invert(var(--dark-mode, 0));" 
                 onerror="this.style.display='none'"/>
            <div>
              <h1 style="margin: 0; font-size: 1.5em;">Sistema di Sicurezza</h1>
              <p style="margin: 0; opacity: 0.7;">Powered by Ajax Systems</p>
            </div>
          </div>
        card_mod:
          style: |
            ha-card {
              background: transparent !important;
              box-shadow: none !important;
            }

      # Pannello Allarme principale
      - type: alarm-panel
        entity: alarm_control_panel.ajax_hub_panel
        name: Controllo Allarme
        states:
          - arm_away
          - arm_home
          - arm_night

      # Contatori sensori
      - type: horizontal-stack
        cards:
          - type: entity
            entity: sensor.connee_sensori_totale
            name: Totale
            icon: mdi:counter
          - type: entity
            entity: sensor.connee_sensori_ok
            name: OK
            icon: mdi:check-circle
          - type: entity
            entity: sensor.connee_sensori_allarme
            name: Allarme
            icon: mdi:alert-circle
          - type: entity
            entity: sensor.connee_sensori_offline
            name: Offline
            icon: mdi:wifi-off

      # Sensori Porte/Finestre
      - type: entities
        title: Porte e Finestre
        show_header_toggle: false
        entities:
          - entity: binary_sensor.ajax_example_door_state
            name: Esempio Porta
            secondary_info: last-changed

      # Sensori Movimento
      - type: entities
        title: Movimento
        show_header_toggle: false
        entities:
          - entity: binary_sensor.ajax_example_motion_state
            name: Esempio Movimento
            secondary_info: last-changed

      # Valvole Acqua (se presenti)
      - type: entities
        title: Valvole Acqua
        show_header_toggle: false
        entities:
          - entity: valve.ajax_example_valve
            name: Esempio Valvola
            secondary_info: last-changed

      # Stato Connessione
      - type: entity
        entity: sensor.connee_alarm_stato_connessione
        name: Gateway Connee
